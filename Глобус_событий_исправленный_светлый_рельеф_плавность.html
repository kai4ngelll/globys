<style>
:root{
  color-scheme:dark;
  --night:#07110d;--night-2:#0a1711;--panel:rgba(10,25,18,.94);
  --paper:#e9eee3;--muted:#9aab9b;--hair:rgba(202,220,197,.16);
  --war:#df795f;--civil:#d7b16a;--politics:#8fb9a0;
  --serif:Georgia,"Times New Roman",serif;
  --sans:Inter,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--paper);overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}
body{font-family:var(--sans);background:radial-gradient(ellipse at 50% 43%,#173322 0%,#0a1a11 42%,#040a07 100%);-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;outline:none}
#c:active{cursor:grabbing}
#mk{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.m{position:absolute;left:0;top:0;width:32px;height:32px;margin:-16px 0 0 -16px;padding:0;border:0;background:transparent;pointer-events:auto;cursor:pointer}
.m i{position:absolute;left:11px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--c);border:1.5px solid rgba(246,249,239,.9);box-shadow:0 0 0 4px rgba(3,12,7,.65),0 0 13px color-mix(in srgb,var(--c),transparent 45%);transition:transform .2s ease,box-shadow .2s ease}
.m i:after{content:"";position:absolute;inset:-6px;border:1px solid var(--c);border-radius:50%;opacity:0;transform:scale(.7);transition:opacity .2s ease,transform .2s ease}
.m:hover i,.m.on i{transform:scale(1.28);box-shadow:0 0 0 5px rgba(3,12,7,.78),0 0 19px color-mix(in srgb,var(--c),transparent 20%)}
.m.on i:after{opacity:.75;transform:scale(1)}
.m:focus-visible{outline:1px solid var(--paper);outline-offset:1px;border-radius:50%}
.hd{position:fixed;left:clamp(18px,3.1vw,46px);top:clamp(18px,3.2vh,38px);pointer-events:none;max-width:min(580px,70vw);padding:0 14px 12px 0;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.eyebrow{font:600 9px/1.4 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:#a6b8a5;margin-bottom:9px}
.hd h1{font:500 clamp(25px,2.35vw,34px)/1.02 var(--serif);letter-spacing:-.025em;margin:0 0 12px;color:#edf1e8}
.sub{font:400 12px/1.5 var(--sans);color:var(--mut);letter-spacing:.015em;margin-bottom:17px}
.lg{display:flex;flex-wrap:wrap;gap:9px 16px;align-items:center}
.lg span{display:inline-flex;align-items:center;gap:7px;font:500 10px/1.3 var(--sans);color:#c0cbbd;white-space:nowrap}
.lg span:before{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c),transparent 60%)}
.lg .count{color:#879989;padding-left:4px}
.lg .count:before{display:none}
.hint{position:fixed;right:clamp(18px,3.1vw,46px);top:clamp(22px,3.4vh,40px);font:500 9px/1.5 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:#9aab9b;text-align:right;pointer-events:none}
.hint:after{content:"";display:block;width:38px;height:1px;background:rgba(190,211,184,.35);margin:9px 0 0 auto}
#pn{position:fixed;right:clamp(16px,3vw,42px);bottom:clamp(16px,3vh,36px);width:min(430px,calc(100% - 32px));padding:24px 25px 22px;background:linear-gradient(145deg,rgba(14,31,21,.97),rgba(6,17,11,.97));border:1px solid var(--hair);border-top-color:rgba(207,226,197,.28);box-shadow:0 24px 80px rgba(0,0,0,.38);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:3px 16px 3px 16px;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .24s ease,transform .3s cubic-bezier(.2,.75,.2,1)}
#pn.s{opacity:1;transform:translateY(0);pointer-events:auto}
#pn .t{font:600 9px/1.5 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--c);margin:0 34px 10px 0}
#pn h2{font:500 clamp(21px,2vw,26px)/1.13 var(--serif);letter-spacing:-.015em;margin:0 28px 11px 0;color:#eff2e9}
#pn p{font:400 13px/1.65 var(--sans);color:#c0ccbf;margin:0 0 19px}
#pn a{display:inline-flex;align-items:center;gap:12px;min-height:42px;padding:0 15px;background:#dce7d7;color:#102016;text-decoration:none;font:650 11px/1 var(--sans);letter-spacing:.035em;border:1px solid rgba(255,255,255,.16);border-radius:2px;transition:background .18s ease,transform .18s ease}
#pn a:after{content:"↗";font-size:14px;font-weight:400}
#pn a:hover{background:#f0f4e9;transform:translateY(-1px)}
#pn a:focus-visible,#x:focus-visible{outline:2px solid #f1f4e9;outline-offset:3px}
#x{position:absolute;right:13px;top:12px;width:30px;height:30px;border:1px solid rgba(205,220,198,.17);border-radius:50%;background:transparent;color:#b9c7b7;font:300 19px/1 var(--sans);cursor:pointer;transition:background .18s ease,color .18s ease}
#x:hover{background:rgba(220,235,214,.1);color:#fff}
#ld{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#07110d;color:#b4c3b1;font:500 10px/1.5 var(--sans);letter-spacing:.17em;text-transform:uppercase;transition:opacity .7s ease}
#ld:before{content:"";width:22px;height:22px;border:1px solid rgba(193,214,185,.25);border-top-color:#c4d4bc;border-radius:50%;position:absolute;margin-top:-42px;animation:spin 1.2s linear infinite}
#ld.h{opacity:0;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){
  .hd{left:18px;top:18px;max-width:calc(100% - 36px)}
  .hd h1{font-size:25px;margin-bottom:8px}
  .sub{font-size:11px;margin-bottom:11px;max-width:280px}
  .lg{gap:7px 12px;max-width:330px}
  .lg span{font-size:9px}
  .hint{top:auto;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));font-size:8px}
  .hint:after{margin-top:6px}
  #pn{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;padding:20px 19px 18px}
  #pn h2{font-size:22px}
  #pn p{font-size:12.5px;line-height:1.55;margin-bottom:15px}
}
@media(max-width:390px){
  .eyebrow{font-size:8px}
  .hd h1{font-size:22px}
  .lg{max-width:275px}
  .lg span{font-size:8px}
}
.data-credit{position:fixed;left:18px;bottom:15px;font:400 8px/1.4 var(--sans);letter-spacing:.08em;color:rgba(185,202,180,.42);pointer-events:none}\n@media(max-width:700px){.data-credit{bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:7px}}\n@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}
</style>
</head>

var EV=[["Украина","Вторжение России на Украину",48.6,32.0,"w","с 2022","24 февраля 2022 года российские войска начали полномасштабное вторжение. Боевые действия идут на востоке и юге страны.","Вторжение_России_на_Украину_(2022)"],["Украина","Евромайдан",50.45,30.52,"p","2013–2014","Массовые протесты в Киеве после отказа от соглашения с ЕС привели к смене власти в феврале 2014 года.","Евромайдан"],["Сирия","Гражданская война в Сирии",35.0,38.5,"c","2011–2024","Протесты 2011 года переросли в вооружённый конфликт с участием множества сторон и внешних держав.","Гражданская_война_в_Сирии"],["Ирак","Война в Ираке",33.3,44.4,"w","2003–2011","Войска США и союзников свергли режим Саддама Хусейна, после чего страна пережила годы повстанческой войны.","Война_в_Ираке"],["Афганистан","Война в Афганистане",34.5,69.2,"w","2001–2021","Коалиция во главе с США свергла «Талибан» в 2001 году. В 2021 году талибы вернули власть.","Война_в_Афганистане_(2001—2021)"],["Палестина и Израиль","Палестино-израильский конфликт",31.5,34.8,"w","с 1948","Многолетний конфликт за территорию и государственность, включающий несколько войн и эскалаций.","Палестино-израильский_конфликт"],["Йемен","Гражданская война в Йемене",15.5,45.5,"c","с 2014","Борьба хуситов с признанным правительством, в которую вмешалась коалиция во главе с Саудовской Аравией.","Гражданская_война_в_Йемене"],["Ливия","Гражданская война в Ливии",32.9,13.2,"c","2011","Восстание против Муаммара Каддафи при поддержке интервенции НАТО завершилось падением режима.","Гражданская_война_в_Ливии_(2011)"],["Тунис","Арабская весна",36.8,10.2,"p","с 2010","Волна протестов началась в Тунисе и привела к смене власти в нескольких странах региона.","Арабская_весна"],["Руанда","Геноцид в Руанде",-1.9,30.1,"c","1994","За около 100 дней были убиты сотни тысяч представителей народа тутси и умеренные хуту.","Геноцид_в_Руанде"],["Босния и Герцеговина","Югославские войны",43.9,17.7,"w","1991–2001","Распад Югославии сопровождался серией войн, самой тяжёлой из которых стала война в Боснии.","Югославские_войны"],["Россия","Первая чеченская война",43.3,45.7,"w","1994–1996","Вооружённый конфликт между федеральными силами и непризнанной Чеченской Республикой Ичкерия.","Первая_чеченская_война"],["Россия","Октябрьская революция",59.93,30.32,"p","1917","Вооружённое восстание в Петрограде привело большевиков к власти и открыло путь к созданию СССР.","Октябрьская_революция"],["Корея","Корейская война",38.0,127.2,"w","1950–1953","Война между Севером и Югом при участии США и КНР закончилась перемирием и сохранением раздела страны.","Корейская_война"],["Вьетнам","Вьетнамская война",16.0,107.8,"w","1955–1975","Конфликт между Севером и Югом при участии США завершился объединением страны под властью Севера.","Вьетнамская_война"],["Куба","Кубинская революция",22.0,-79.5,"p","1953–1959","Повстанцы Фиделя Кастро свергли диктатуру Батисты и установили новый режим.","Кубинская_революция"],["Испания","Гражданская война в Испании",40.4,-3.7,"c","1936–1939","Республиканцы воевали с мятежниками генерала Франко. Победа националистов привела к диктатуре.","Гражданская_война_в_Испании"],["Германия","Падение Берлинской стены",52.52,13.4,"p","1989","9 ноября 1989 года открылась граница между Восточным и Западным Берлином, а в 1990 году Германия объединилась.","Падение_Берлинской_стены"],["Чехия","Бархатная революция",50.08,14.43,"p","1989","Мирные протесты привели к отказу коммунистов от власти в Чехословакии.","Бархатная_революция"],["Грузия","Революция роз",41.7,44.8,"p","2003","Массовые протесты после парламентских выборов вынудили президента Шеварднадзе уйти в отставку.","Революция_роз"],["Азербайджан и Армения","Вторая карабахская война",39.8,46.9,"w","2020","44-дневная война закончилась возвращением Азербайджаном контроля над значительной частью Нагорного Карабаха.","Вторая_карабахская_война"],["Мьянма","Гражданская война в Мьянме",21.0,96.0,"c","с 2021","После военного переворота 2021 года в стране развернулось вооружённое сопротивление ху var atmosphere=new THREE.ShaderMaterial({

 fragmentShader:"varying vec3 vN;varying vec3 vW;uniform vec3 cameraPosition;void main(){float facing=max(0.0,dot(normalize(vN),normalize(cameraPosition-vW)));float rim=pow(1.0-facing,4.5);gl_FragColor=vec4(0.10,0.24,0.16,rim*0.22);}"
});

// звёзды
var sp=[];for(var i=0;i<1800;i++){var u=Math.random()*2-1,a=Math.random()*6.283,r=Math.sqrt(1-u*u);sp.push(40*r*Math.cos(a),40*u,40*r*Math.sin(a))}

var lat=.45,lon=40*D2R,dist=3.4,tl=lat,tn=lon,td=dist,vx=0,vy=0,auto=true,fly=null;
function size(){

}

var dr=false,lx=0,ly=0,moved=0,pts={},pd=0,pointerTime=0,lastMoveX=0,lastMoveY=0;
function consume(e){if(e.cancelable)e.preventDefault()}
cvs.addEventListener("contextmenu",function(e){e.preventDefault()});
cvs.addEventListener("pointerdown",function(e){
 consume(e);try{cvs.setPointerCapture(e.pointerId)}catch(_){}
 pts[e.pointerId]={clientX:e.clientX,clientY:e.clientY};
 dr=true;lx=e.clientX;ly=e.clientY;lastMoveX=lx;lastMoveY=ly;pointerTime=e.timeStamp;
 moved=0;auto=false;fly=null;vx=vy=0;
 if(Object.keys(pts).length===2){var k=Object.keys(pts);pd=Math.hypot(pts[k[0]].clientX-pts[k[1]].clientX,pts[k[0]].clientY-pts[k[1]].clientY)}
},{passive:false});
cvs.addEventListener("pointermove",function(e){
 if(!pts[e.pointerId])return;consume(e);
 var samples=(typeof e.getCoalescedEvents==="function"?e.getCoalescedEvents():[]);
 if(!samples.length)samples=[e];
 samples.forEach(function(sample){
  var k=Object.keys(pts);
  if(k.length===2){
   pts[e.pointerId]={clientX:sample.clientX,clientY:sample.clientY};
   var d=Math.hypot(pts[k[0]].clientX-pts[k[1]].clientX,pts[k[0]].clientY-pts[k[1]].clientY);
   if(pd>0&&d>0)td=Math.min(4.8,Math.max(1.16,td*pd/d));pd=d;return;
  }
  var dx=sample.clientX-lx,dy=sample.clientY-ly;
  var elapsed=Math.max(4,sample.timeStamp-pointerTime)/1000;
  lx=sample.clientX;ly=sample.clientY;pointerTime=sample.timeStamp;
  moved+=Math.abs(dx)+Math.abs(dy);
  var scale=.00215*Math.sqrt(Math.max(.45,dist));
  var ax=-dx*scale,ay=dy*scale;
  tn+=ax;tl=Math.max(-1.52,Math.min(1.52,tl+ay));
  var ivx=ax/elapsed,ivy=ay/elapsed;
  vx=vx*.35+ivx*.65;vy=vy*.35+ivy*.65;
  pts[e.pointerId]={clientX:sample.clientX,clientY:sample.clientY};
 });
});
function up(e){consume(e);delete pts[e.pointerId];dr=Object.keys(pts).length>0;if(!dr){lastMoveX=lx;lastMoveY=ly}}

cvs.addEventListener("lostpointercapture",up);
cvs.addEventListener("wheel",function(e){e.preventDefault();auto=false;td=Math.min(4.8,Math.max(1.16,td*Math.exp(e.deltaY*.00048)))},{passive:false});

// ---- метки и панель ----
var mk=document.getElementById("mk"),pn=document.getElementById("pn"),cur=null,els=[];
EV.forEach(function(e,i){var b=document.createElement("button");b.className="m";b.style.setProperty("--c",COL[e[4]]);b.setAttribute("aria-label",e[1]);b.innerHTML="<i></i>";
 b.onclick=function(){open(i)};mk.appendChild(b);els.push({b:b,p:v3(e[2],e[3],1.004),x:-9999,y:-9999,visible:false})});

 document.getElementById("pt").textContent=TN[e[4]]+" · "+e[0]+" · "+e[5];document.getElementById("ph").textContent=e[1];document.getElementById("pp").textContent=e[6];
 var wikiLang=/[А-Яа-яЁё]/.test(e[7])?"ru":"en";
 document.getElementById("pa").href="https://"+wikiLang+".wikipedia.org/wiki/"+encodeURIComponent(e[7].replace(/ /g,"_"));
 document.getElementById("pa").setAttribute("aria-label","Открыть статью «"+e[1]+"» в Википедии в новой вкладке");
 pn.classList.add("s");
 auto=false;var a=e[3]*D2R,dl=((a-lon+Math.PI*3)%(Math.PI*2))-Math.PI;fly={t:0,l0:lat,n0:lon,d0:dist,l1:e[2]*D2R*.9,n1:lon+dl,d1:Math.min(dist,1.9)}}
function close(){pn.classList.remove("s");if(cur!=null)els[cur].b.classList.remove("on");cur=null}
document.getElementById("x").onclick=close;addEventListener("keydown",function(e){if(e.key==="Escape")close()});

// ---- цикл ----
var last=performance.now(),tmp=new THREE.Vector3(),cp=new THREE.Vector3(),reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function ease(t){return t<.5?16*t*t*t*t*t:1-Math.pow(-2*t+2,5)/2}
var qualityClock=0,qualityFrames=0,qualityRatio=basePixelRatio;
function frame(now){var dt=Math.min(.033,(now-last)/1000);last=now;
 qualityClock+=dt;qualityFrames++;
 if(qualityClock>=2.5){
  var averageFrame=qualityClock/qualityFrames;
  if(averageFrame>.021&&qualityRatio>1.0){
   qualityRatio=Math.max(1.0,qualityRatio-.15);R.setPixelRatio(qualityRatio);
   R.setSize(innerWidth,innerHeight,false);
  }else if(averageFrame<.014&&qualityRatio<basePixelRatio){
   qualityRatio=Math.min(basePixelRatio,qualityRatio+.05);R.setPixelRatio(qualityRatio);
   R.setSize(innerWidth,innerHeight,false);
  }
  qualityClock=0;qualityFrames=0;
 }
 if(fly){fly.t=Math.min(1,fly.t+dt/(reduce?.01:3.0));var k=ease(fly.t);lat=tl=fly.l0+(fly.l1-fly.l0)*k;lon=tn=fly.n0+(fly.n1-fly.n0)*k;dist=td=fly.d0+(fly.d1-fly.d0)*k;if(fly.t>=1)fly=null}
 else{
  if(!dr&&!reduce){
   tn+=vx*dt;tl+=vy*dt;
   var friction=Math.exp(-3.4*dt);vx*=friction;vy*=friction;
   if(Math.abs(vx)<.0005)vx=0;if(Math.abs(vy)<.0005)vy=0;
   tl=Math.max(-1.52,Math.min(1.52,tl));
  }

 }
 G.rotation.set(lat,-Math.PI/2-lon,0);C.position.set(0,0,dist);C.lookAt(0,0,0);R.render(S,C);
 G.updateMatrixWorld();var w=innerWidth,h=innerHeight,sc=dist<2.2?1:.78;
 els.forEach(function(m){
  tmp.copy(m.p).applyMatrix4(G.matrixWorld);
  var vis=tmp.z*dist>1.0+.02;
  if(!vis){if(m.visible){m.b.style.display="none";m.visible=false}return}
  cp.copy(tmp).project(C);
  var x=(cp.x+1)/2*w,y=(1-cp.y)/2*h;
  if(!m.visible){m.b.style.display="block";m.visible=true}
  if(Math.abs(x-m.x)>.25||Math.abs(y-m.y)>.25){
   m.b.style.transform="translate3d("+x.toFixed(2)+"px,"+y.toFixed(2)+"px,0) scale("+sc+")";
   m.x=x;m.y=y;
  }
 });
 requestAnimationFrame(frame)}
