<title>Глобус событий</title>

<style>
:root{
  color-scheme:dark;
  --night:#07110d;--night-2:#0a1711;--panel:rgba(10,25,18,.94);
  --paper:#e9eee3;--muted:#9aab9b;--hair:rgba(202,220,197,.16);
  --war:#df795f;--civil:#d7b16a;--politics:#8fb9a0;
  --serif:Georgia,"Times New Roman",serif;
  --sans:Inter,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--paper);overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}
body{font-family:var(--sans);background:radial-gradient(ellipse at 50% 43%,#173322 0%,#0a1a11 42%,#040a07 100%);-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;outline:none}
#c:active{cursor:grabbing}
#mk{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.m{position:absolute;left:0;top:0;width:32px;height:32px;margin:-16px 0 0 -16px;padding:0;border:0;background:transparent;pointer-events:auto;cursor:pointer}
.m i{position:absolute;left:11px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--c);border:1.5px solid rgba(246,249,239,.9);box-shadow:0 0 0 3px rgba(3,12,7,.72),0 0 7px color-mix(in srgb,var(--c),transparent 68%);transition:transform .2s ease,box-shadow .2s ease}
.m i:after{content:"";position:absolute;inset:-6px;border:1px solid var(--c);border-radius:50%;opacity:0;transform:scale(.7);transition:opacity .2s ease,transform .2s ease}
.m:hover i,.m.on i{transform:scale(1.28);box-shadow:0 0 0 5px rgba(3,12,7,.78),0 0 19px color-mix(in srgb,var(--c),transparent 20%)}
.m.on i:after{opacity:.75;transform:scale(1)}
.m:focus-visible{outline:1px solid var(--paper);outline-offset:1px;border-radius:50%}
.hd{position:fixed;left:clamp(18px,3.1vw,46px);top:clamp(18px,3.2vh,38px);pointer-events:none;max-width:min(580px,70vw);padding:0 14px 12px 0;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.eyebrow{font:600 9px/1.4 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:#a6b8a5;margin-bottom:9px}
.hd h1{font:500 clamp(25px,2.35vw,34px)/1.02 var(--serif);letter-spacing:-.025em;margin:0 0 12px;color:#edf1e8}

.lg{display:flex;flex-wrap:wrap;gap:9px 16px;align-items:center}
.lg span{display:inline-flex;align-items:center;gap:7px;font:500 10px/1.3 var(--sans);color:#c0cbbd;white-space:nowrap}
.lg span:before{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c),transparent 60%)}


.hint{position:fixed;right:clamp(18px,3.1vw,46px);top:clamp(22px,3.4vh,40px);font:500 9px/1.5 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:#9aab9b;text-align:right;pointer-events:none}
.hint:after{content:"";display:block;width:38px;height:1px;background:rgba(190,211,184,.35);margin:9px 0 0 auto}
#pn{position:fixed;right:clamp(16px,3vw,42px);bottom:clamp(16px,3vh,36px);width:min(430px,calc(100% - 32px));padding:24px 25px 22px;background:linear-gradient(145deg,rgba(14,31,21,.97),rgba(6,17,11,.97));border:1px solid var(--hair);border-top-color:rgba(207,226,197,.28);box-shadow:0 24px 80px rgba(0,0,0,.38);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:3px 16px 3px 16px;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .24s ease,transform .3s cubic-bezier(.2,.75,.2,1)}
#pn.s{opacity:1;transform:translateY(0);pointer-events:auto}
#pn .t{font:600 9px/1.5 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--c);margin:0 34px 10px 0}
#pn h2{font:500 clamp(21px,2vw,26px)/1.13 var(--serif);letter-spacing:-.015em;margin:0 28px 11px 0;color:#eff2e9}
#pn p{font:400 13px/1.65 var(--sans);color:#c0ccbf;margin:0 0 19px}
#pn a{display:inline-flex;align-items:center;gap:12px;min-height:42px;padding:0 15px;background:#dce7d7;color:#102016;text-decoration:none;font:650 11px/1 var(--sans);letter-spacing:.035em;border:1px solid rgba(255,255,255,.16);border-radius:2px;transition:background .18s ease,transform .18s ease}
#pn a:after{content:"↗";font-size:14px;font-weight:400}
#pn a:hover{background:#f0f4e9;transform:translateY(-1px)}
#pn a:focus-visible,#x:focus-visible{outline:2px solid #f1f4e9;outline-offset:3px}
#x{position:absolute;right:13px;top:12px;width:30px;height:30px;border:1px solid rgba(205,220,198,.17);border-radius:50%;background:transparent;color:#b9c7b7;font:300 19px/1 var(--sans);cursor:pointer;transition:background .18s ease,color .18s ease}
#x:hover{background:rgba(220,235,214,.1);color:#fff}
#ld{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#07110d;color:#b4c3b1;font:500 10px/1.5 var(--sans);letter-spacing:.17em;text-transform:uppercase;transition:opacity .7s ease}
#ld:before{content:"";width:22px;height:22px;border:1px solid rgba(193,214,185,.25);border-top-color:#c4d4bc;border-radius:50%;position:absolute;margin-top:-42px;animation:spin 1.2s linear infinite}
#ld.h{opacity:0;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){
  .hd{left:18px;top:18px;max-width:calc(100% - 36px)}
  .hd h1{font-size:25px;margin-bottom:8px}
  
  .lg{gap:7px 12px;max-width:330px}
  .lg span{font-size:9px}
  .hint{top:auto;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));font-size:8px}
  .hint:after{margin-top:6px}
  #pn{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;padding:20px 19px 18px}
  #pn h2{font-size:22px}
  #pn p{font-size:12.5px;line-height:1.55;margin-bottom:15px}
}
@media(max-width:390px){
  .eyebrow{font-size:8px}
  .hd h1{font-size:22px}
  .lg{max-width:275px}
  .lg span{font-size:8px}
}
.data-credit{position:fixed;left:18px;bottom:15px;max-width:42vw;font:400 8px/1.4 var(--sans);letter-spacing:.08em;color:rgba(185,202,180,.42);pointer-events:none}
@media(max-width:700px){
 .data-credit{left:18px;right:18px;bottom:calc(47px + env(safe-area-inset-bottom,0px));max-width:none;font-size:7px;line-height:1.35}
 .hint{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}
</style>
</head>

 из которых стала война в Боснии.","Югославские_войны"],["Россия","Первая чеченская война",43.3,45.7,"w","1994–1996","Вооружённый конфликт между федеральными силами и непризнанной Чеченской Республикой Ичкерия.","Первая_чеченская_война"],["Россия","Октябрьская революция",59.93,30.32,"p","1917","Вооружённое восстание в Петрограде привело большевиков к власти и открыло путь к созданию СССР.","Октябрьская_революция"],["Корея","Корейская война",38.0,127.2,"w","1950–1953","Война между Севером и Югом при участии США и КНР закончилась перемирием и сохранением раздела страны.","Корейская_война"],["Вьетнам","Вьетнамская война",16.0,107.8,"w","1955–1975","Конфликт между Севером и Югом при участии США завершился объединением страны под властью Севера.","Вьетнамская_война"],["Куба","Кубинская революция",22.0,-79.5,"p","1953–1959","Повстанцы Фиделя Кастро свергли диктатуру Батисты и установили новый режим.","Кубинская_революция"],["Испания","Гражданская война в Испании",40.4,-3.7,"c","1936–1939","Республиканцы воевали с мятежниками генерала Франко. Победа националистов привела к диктатуре.","Гражданская_война_в_Испании"],["Германия","Падение Берлинской стены",52.52,13.4,"p","1989","9 ноября 1989 года открылась граница между Восточным и Западным Берлином, а в 1990 году Германия объединилась.","Падение_Берлинской_стены"],["Чехия","Бархатная революция",50.08,14.43,"p","1989","Мирные протесты привели к отказу коммунистов от власти в Чехословакии.","Бархатная_революция"],["Грузия","Революция роз",41.7,44.8,"p","2003","Массовые протесты после парламентских выборов вынудили президента Шеварднадзе уйти в отставку.","Революция_роз"],["Азербайджан и Армения","Вторая карабахская война",39.8,46.9,"w","2020","44-дневная война закончилась возвращением Азербайджаном контроля над значительной частью Нагорного Карабаха.","Вторая_карабахская_война"],["Мьянма","Гражданская война в Мьянме",21.0,96.0,"c","с 2021","После военного переворота 2021 года в стране развернулось вооружённое сопротивление ху    mesh.geometry.dispose();
   mesh.material.dispose();
  });
  tileLevel = -1;
  return;
 }
 if (now < tileRefreshAt) return;
 tileRefreshAt = now + 180;

 var z = Math.max(3, Math.min(13, Math.round(5 + 5.2 * Math.log2(2.65 / radius))));
 var q = C.position.clone().normalize();
 G.updateMatrixWorld();
 q.applyQuaternion(G.quaternion.clone().invert());
 var n = Math.pow(2, z);
 var centerLat = Math.asin(q.y) / D2R;
 var centerLon = Math.atan2(-q.z, q.x) / D2R;
 var angular = Math.atan((radius - 1) * Math.tan(19 * D2R) * 1.8) / D2R;
 var tileSpan = 360 / n;

 // Load a wider ring around the view so movement does not expose unloaded areas.
 var latSpan = angular * 1.75 + tileSpan * 2;
 var lonSpan = latSpan / Math.max(.12, Math.cos(centerLat * D2R));
 var centerX = Math.floor((centerLon + 180) / 360 * n);
 var centerY = Math.floor((1 - Math.log(Math.tan(Math.PI / 4 + centerLat * D2R / 2)) / Math.PI) / 2 * n);
 var xRange = Math.ceil(lonSpan / 360 * n) + 2;
 var yRange = Math.ceil(latSpan / 180 * n) + 2;
 var needed = [];
 for (var dy = -yRange; dy <= yRange; dy++) {
  var y = centerY + dy;
  if (y < 0 || y >= n) continue;
  for (var dx = -xRange; dx <= xRange; dx++) {
   var x = (centerX + dx + n) % n;
   var lat = tileLat(y + .5, z);
   var lon = (x + .5) / n * 360 - 180;
   var dot = v3(lat, lon, 1).dot(q);
   if (dot < -0.05) continue;
   needed.push({ key: z + "/" + x + "/" + y, x: x, y: y, dot: dot });
  }
 }

 // Center tiles are requested first; surrounding tiles are prefetched next.
 needed.sort(function(a, b) { return b.dot - a.dot; });
 needed.forEach(function(item) {
  var entry = requestTile(item.x, item.y, z);
  if (!entry.texture || entry.failed) return;
  if (tileLayer.children.some(function(mesh) { return mesh.userData.tileKey === item.key; })) return;
  var material = new THREE.MeshBasicMaterial({
   map: entry.texture,
   color: 0xffffff,
   side: THREE.DoubleSide,
   polygonOffset: true,
   polygonOffsetFactor: -1,
   polygonOffsetUnits: -1
  });
  var mesh = new THREE.Mesh(makeTileGeometry(item.x, item.y, z), material);
  mesh.userData.tileKey = item.key;
  mesh.userData.tileLevel = z;
  tileLayer.add(mesh);
 });

 // Keep previously loaded imagery around the camera until replacement tiles arrive.
 // This prevents visible holes while the user rotates or zooms the globe.
 var keepAngle = Math.min(85, angular * 2.8 + tileSpan * 4) * D2R;
 var keepDot = Math.cos(keepAngle);
 tileLayer.children.slice().forEach(function(mesh) {
  var parts = mesh.userData.tileKey.split("/").map(Number);
  var level = parts[0], x = parts[1], y = parts[2];
  var nLevel = Math.pow(2, level);
  var lat = tileLat(y + .5, level);
  var lon = (x + .5) / nLevel * 360 - 180;
  if (v3(lat, lon, 1).dot(q) < keepDot) {
   tileLayer.remove(mesh);
   mesh.geometry.dispose();
   mesh.material.dispose();
  }
 });

 // Bound the cache so long sessions do not keep unlimited GPU textures.
 if (tileCache.size > 1800) {
  tileCache.forEach(function(entry, key) {
   if (tileCache.size <= 1400) return;
   if (!entry.loading && !entry.texture) tileCache.delete(key);
  });
 }
}

// High-detail terrain normal map gives mountains, ridges and valleys readable
// relief under fixed, all-around daylight. A global DEM is used as an additional bump map.
loader.load("https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_normal_2048.jpg",function(t){
 t.encoding=THREE.LinearEncoding;
 t.anisotropy=Math.min(mobileGPU?2:4,R.capabilities.getMaxAnisotropy());
 earthMat.normalMap=t;
 earthMat.normalScale.set(.9,.9);
 earthMat.needsUpdate=true;
},undefined,function(){console.warn("Earth normal map unavailable.")});

loader.load("https://asterweb.jpl.nasa.gov/images/GDEM-10km-BW.png",function(t){
 t.encoding=THREE.LinearEncoding;
 t.anisotropy=Math.min(mobileGPU?2:4,R.capabilities.getMaxAnisotropy());
 earthMat.bumpMap=t;
 earthMat.bumpScale=.045;
 earthMat.needsUpdate=true;
},undefined,function(){console.warn("ASTER elevation map unavailable.")});

// Soft, separate cloud shell; it is deliberately subtle and never darkens the surface.
loader.load("https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_clouds_1024.png",function(t){
 t.encoding=THREE.sRGBEncoding;

 });

},undefined,function(){});

// Country outlines and coastlines from the original Natural Earth TopoJSON.
// Depth testing makes the far-side boundaries disappear behind the solid globe.
var pos=[];
arcs.forEach(function(a){
 for(var i=0;i<a.length-1;i++){
  var p=v3(a[i][1],a[i][0],1.004),q=v3(a[i+1][1],a[i+1][0],1.004);
  pos.push(p.x,p.y,p.z,q.x,q.y,q.z);
 }
});
var lg=new THREE.BufferGeometry();
lg.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
var borderMat=new THREE.LineBasicMaterial({
 color:0xd3ddc8,transparent:true,opacity:.72,depthTest:true,depthWrite:false
});
G.add(new THREE.LineSegments(lg,borderMat));

// Fine atmosphere rim, restrained so the land texture remains the focus.
var atmosphere=new THREE.ShaderMaterial({
 transparent:true,side:THREE.BackSide,blending:THREE.AdditiveBlending,
 depthWrite:false,depthTest:true,
 vertexShader:"varying vec3 vN;varying vec3 vW;void main(){vec4 wp=modelMatrix*vec4(position,1.0);vW=wp.xyz;vN=normalize(mat3(modelMatrix)*normal);gl_Position=projectionMatrix*viewMatrix*wp;}",
 fragmentShader:"varying vec3 vN;varying vec3 vW;uniform vec3 cameraPosition;void main(){float f=max(0.0,dot(normalize(vN),normalize(cameraPosition-vW)));float rim=pow(1.0-f,3.2);gl_FragColor=vec4(0.12,0.34,0.48,rim*0.32);}"
});
S.add(new THREE.Mesh(new THREE.SphereGeometry(1.022,mobileGPU?72:112,mobileGPU?48:72),atmosphere));

// Stars remain subtle and static.
var sp=[];
for(var si=0;si<1100;si++){
 var u=Math.random()*2-1,a=Math.random()*6.283,r=Math.sqrt(1-u*u);
 sp.push(38*r*Math.cos(a),38*u,38*r*Math.sin(a));
}
var sg=new THREE.BufferGeometry();
sg.setAttribute("position",new THREE.Float32BufferAttribute(sp,3));
S.add(new THREE.Points(sg,new THREE.PointsMaterial({
 color:0xc8d5df,size:.075,sizeAttenuation:true,transparent:true,opacity:.58
})));

// Fixed daylight: the whole globe is evenly visible at every camera angle and time.
S.add(new THREE.AmbientLight(0xffffff,1.18));
var keyLight=new THREE.DirectionalLight(0xffffff,.72);
keyLight.position.set(-4,3,5);S.add(keyLight);
var fillLight=new THREE.DirectionalLight(0xb7d4e2,.34);
fillLight.position.set(4,-2,-4);S.add(fillLight);

// Self-contained controls; no additional CDN dependency.
// This avoids a blank screen if OrbitControls fails to load on a mobile connection.
var fly=null;
var controls={
 enabled:true,autoRotate:true,
 update:function(){
  if(!this.enabled)return;
  if(this.autoRotate&&!dragging){G.rotation.y+=.00022}
  if(!dragging){
   G.rotation.y+=velocityX;
   G.rotation.x+=velocityY;
   velocityX*=.92;velocityY*=.92;
   if(Math.abs(velocityX)<.000002)velocityX=0;
   if(Math.abs(velocityY)<.000002)velocityY=0;
  }
  G.rotation.x=Math.max(-1.48,Math.min(1.48,G.rotation.x));
  // The camera always stays on a ray through the globe's exact center.
  var cameraRadius=C.position.length();
  if(cameraRadius>0.0001){
   C.position.normalize().multiplyScalar(Math.max(1.28,Math.min(5.2,cameraRadius)));
   C.lookAt(0,0,0);
  }
 },
 addEventListener:function(){}
};
cvs.style.touchAction="none";
cvs.style.webkitUserSelect="none";
var pointers=new Map(),dragging=false,lastX=0,lastY=0,lastPinch=0;
var velocityX=0,velocityY=0;
function pinchDistance(){
 var a=Array.from(pointers.values());
 if(a.length<2)return 0;
 return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
}
cvs.addEventListener("pointerdown",function(e){
 if(!controls.enabled)return;
 if(e.pointerType==="touch")e.preventDefault();
 e.preventDefault();cvs.setPointerCapture(e.pointerId);
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 controls.autoRotate=false;dragging=true;velocityX=velocityY=0;
 lastX=e.clientX;lastY=e.clientY;lastPinch=pinchDistance();
},{passive:false});
cvs.addEventListener("pointermove",function(e){
 if(!pointers.has(e.pointerId)||!controls.enabled)return;
 e.preventDefault();
 var old=pointers.get(e.pointerId),dx=e.clientX-old.x,dy=e.clientY-old.y;
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size>=2){
  var d=pinchDistance();
  if(lastPinch>0&&d>0){
   var radius=C.position.length();
   var nextRadius=Math.max(1.28,Math.min(5.2,radius*lastPinch/d));
   C.position.normalize().multiplyScalar(nextRadius);
   C.lookAt(0,0,0);
  }
  lastPinch=d;
 }else{
  var factor=.0062;
  G.rotation.y+=dx*factor;
  G.rotation.x+=dy*factor;
  velocityX=dx*factor*.34;velocityY=dy*factor*.34;
 }
 lastX=e.clientX;lastY=e.clientY;
},{passive:false});
function pointerEnd(e){
 pointers.delete(e.pointerId);
 if(pointers.size<2)lastPinch=0;
 if(pointers.size===0)dragging=false;
}
cvs.addEventListener("pointerup",pointerEnd);
cvs.addEventListener("pointercancel",pointerEnd);
cvs.addEventListener("lostpointercapture",pointerEnd);
cvs.addEventListener("wheel",function(e){
 e.preventDefault();controls.autoRotate=false;
 var radius=C.position.length();
 var nextRadius=Math.max(1.28,Math.min(5.2,radius+e.deltaY*.002));
 C.position.normalize().multiplyScalar(nextRadius);
 C.lookAt(0,0,0);
},{passive:false});
function size(){
 var w=innerWidth,h=innerHeight;
 R.setSize(w,h,false);
 C.aspect=w/h;C.updateProjectionMatrix();
}
addEventListener("resize",size);
var pageVisible=!document.hidden;
document.addEventListener("visibilitychange",function(){
 pageVisible=!document.hidden;
 if(pageVisible){last=performance.now();requestAnimationFrame(frame)}
});

// ---- Markers and info panel ----
// ---- Markers and info panel ----
var mk=document.getElementById("mk"),pn=document.getElementById("pn"),cur=null,els=[];
EV.forEach(function(e,i){var b=document.createElement("button");b.className="m";b.style.setProperty("--c",COL[e[4]]);b.setAttribute("aria-label",e[1]);b.innerHTML="<i></i>";
 b.onclick=function(){open(i)};mk.appendChild(b);els.push({b:b,p:v3(e[2],e[3],1.004),x:-9999,y:-9999,visible:false})});
function open(i){
 var e=EV[i];
 // A new marker tap smoothly replaces an in-progress focus movement.
 if(fly){fly=null;controls.enabled=true;}
 if(cur!=null)els[cur].b.classList.remove("on");
 cur=i;els[i].b.classList.add("on");pn.style.setProperty("--c",COL[e[4]]);
 document.getElementById("pt").textContent=TN[e[4]]+" · "+e[0]+" · "+e[5];
 document.getElementById("ph").textContent=e[1];
 document.getElementById("pp").textContent=e[6];
 var wikiLang=/[А-Яа-яЁё]/.test(e[7])?"ru":"en";
 document.getElementById("pa").href="https://"+wikiLang+".wikipedia.org/wiki/"+encodeURIComponent(e[7].replace(/ /g,"_"));
 document.getElementById("pa").setAttribute("aria-label","Открыть статью «"+e[1]+"» в Википедии в новой вкладке");
 pn.classList.add("s");
 var worldPoint=els[i].p.clone().applyMatrix4(G.matrixWorld).normalize();
 var targetDistance=Math.min(C.position.length(),2.0);
 fly={t:0,duration:1.35,start:C.position.clone(),
      end:worldPoint.multiplyScalar(targetDistance)};
 controls.enabled=false;
}
function close(){pn.classList.remove("s");if(cur!=null)els[cur].b.classList.remove("on");cur=null}
document.getElementById("x").onclick=close;addEventListener("keydown",function(e){if(e.key==="Escape")close()});

// ---- Render loop ----
var last=performance.now(),tmp=new THREE.Vector3(),cp=new THREE.Vector3();
var cameraDir=new THREE.Vector3();
function ease(t){return 1-Math.pow(1-t,5)}
var markerClock=0;
function frame(now){
 if(!pageVisible)return;
 var dt=Math.min(.033,(now-last)/1000);last=now;
 if(fly){
  fly.t=Math.min(1,fly.t+dt/fly.duration);
  var k=ease(fly.t);
  C.position.lerpVectors(fly.start,fly.end,k);
  C.position.normalize().multiplyScalar(
   Math.max(1.28,Math.min(5.2,C.position.length()))
  );
  C.lookAt(0,0,0);
  if(fly.t>=1){fly=null;controls.enabled=true;controls.update()}
 }else{
  controls.update();
 }
 updateSatelliteTiles(now);
 R.render(S,C);
 markerClock+=dt;
 if(markerClock>=1/30 || fly){
  markerClock=0;
  G.updateMatrixWorld();
  cameraDir.copy(C.position).normalize();
  var w=innerWidth,h=innerHeight;
  var distance=C.position.length(),scale=distance<2.25?1:.78;
  els.forEach(function(m){
  tmp.copy(m.p).applyMatrix4(G.matrixWorld);
  if(tmp.dot(cameraDir)<.02){
   if(m.visible){m.b.style.display="none";m.visible=false}
   return;
  }
  cp.copy(tmp).project(C);
  var x=(cp.x+1)/2*w,y=(1-cp.y)/2*h;
  if(cp.z>1||x<-40||x>w+40||y<-40||y>h+40){
   if(m.visible){m.b.style.display="none";m.visible=false}
   return;
  }
  if(!m.visible){m.b.style.display="block";m.visible=true}
  if(Math.abs(x-m.x)>.18||Math.abs(y-m.y)>.18){
   m.b.style.transform="translate3d("+x.toFixed(2)+"px,"+y.toFixed(2)+"px,0) scale("+scale+")";
   m.x=x;m.y=y;
  }
  });
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(function(){ld.classList.add("h")},7000);
})();
